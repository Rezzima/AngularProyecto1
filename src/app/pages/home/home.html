<!-- ngFor -->
<div class="container text-center">
  <div class="row">
    <div *ngFor="let i of infoAnima" class="col-lg-4 col-md-6">
      <div class="p-3 card">
        <img src="{{ i.img }}" class="imagenTarjetas card-image-top" alt="{{ i.alt }}">
        <div class="card-body">
          <h5 class="card-title">{{ i.nombre }}</h5>
          <!-- Muestra el nombre del elemento actual ("i.nombre") como título. -->

          <p class="card-text">{{ i.informacion }} - {{ i.edadProm }}</p>
          <!-- Muestra la información y la edad promedio del elemento. -->

          <!-- Data-bs-target apunta al id del modal que se abrirá. -->
          <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#verMasInfo"
            (click)="verMasInfo(i)">
            <!-- "data-bs-toggle='modal'" le indica a Bootstrap que este botón abrirá un modal.
                 "data-bs-target='#verMasInfo'" define qué modal abrir (el que tenga ese id).
                 "(click)='verMasInfo(i)'" ejecuta la función "verMasInfo(i)" del componente Angular al hacer clic,
                 pasando el objeto actual "i" para que el modal muestre su información. -->
            Ver más
          </button>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Modal -->
<div class="modal fade" id="verMasInfo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <!-- 
    "modal" → clase base de Bootstrap que define el componente modal.
    "fade" → agrega una animación de aparición/desaparición suave.
    id="verMasInfo" → identificador que permite abrir el modal desde un botón con data-bs-target="#verMasInfo".
    tabindex="-1" → evita que el modal sea enfocado por tabulación cuando está oculto.
  -->

  <div class="modal-dialog">
    <!-- Contenedor interno del cuadro de diálogo. -->
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">
          {{tarjetaSelect?.nombre}}
          <!-- Muestra el nombre de la tarjeta seleccionada.
               El operador "?."
               evita errores si "tarjetaSelect" es null o undefined. -->
        </h1>

        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        <!-- Data-bs-dismiss="modal" le indica a Bootstrap que cierre automáticamente el modal. -->
      </div>

      <div class="modal-body">
        <div class="modal-imagen">
          <img class="imagenTarjetas" src="{{tarjetaSelect?.img}}" alt="{{tarjetaSelect?.alt}}">
          <!-- Muestra dinámicamente la imagen de la tarjeta seleccionada.
               src y alt usan interpolación Angular.
               "?."
               protege contra valores nulos. -->
        </div>

        <div class="modal-description">
          {{tarjetaSelect?.informacion}}
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <!-- Data-bs-dismiss="modal" → cierra el modal automáticamente al hacer clic. -->
      </div>

    </div>
  </div>
</div>
