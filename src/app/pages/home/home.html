<h1 id="title"><img src="../../../assets/galeriaAnimales.gif" alt="ANGULAR"></h1>

<!-- Carrusel -->
<div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active" data-bs-interval="2000">
      <img src="../../../assets/coqui.webp" class="d-block w-100" alt="coqui">
    </div>
    <div class="carousel-item" data-bs-interval="2000">
      <img src="../../../assets/maradroga.webp" class="d-block w-100" alt="maradona">
    </div>
    <div class="carousel-item">
      <img src="../../../assets/mesi.webp" class="d-block w-100" alt="mesi">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>

    <div class="card-body">

      <p class="card-text">Comelon</p>

</div>

<!-- ngFor -->
<div class="container text-center">
  <div class="row">
    <div *ngFor="let i of infoAnima" class="col-lg-4 col-md-6">
      <div class="p-3 card">
        <img src="{{ i.img }}" class="imagenTarjetas card-image-top" alt="{{ i.alt }}">
        <div class="card-body">
          <h5 class="card-title">{{ i.nombre }}</h5>
          <p class="card-text">{{ i.informacion }} - {{ i.edadProm }}</p>
          <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#verMasInfo"
            (click)="verMasInfo(i)">
            Ver más
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="verMasInfo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">
          {{tarjetaSelect?.nombre}}
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="modal-imagen">
          <img class="imagenTarjetas" src="{{tarjetaSelect?.img}}" alt="{{tarjetaSelect?.alt}}">
        </div>

        <div class="modal-description">
          {{tarjetaSelect?.informacion}}
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container">
    <div class="row mb-5">
      <div class="col-md-6 ">
      </div>
      <div class="col-md-6 text-md-right">
        <ul class="nav-links list-unstyled">
          <li><a href="/home">Home</a></li>
          <li><a href="/about">About</a></li>
          <li><a href="/products">Products</a></li>
          <li><a href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </div>
</footer>
