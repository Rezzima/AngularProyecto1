<!-- galeria -->
<h1 class="titulo">Algunos de nuestros animales</h1>
<!-- ngFor -->
<div class="contenedorTarjetas">
  <div class="container text-center">
    <div class="row">
      <div *ngFor="let i of informacion" class="col-lg-4 col-md-6">
        <div class="p-3 card">
          <img src="{{ i.img }}" class="card-image-top">
          <div class="card-body">
            <h5 class="card-title">{{ i.nombre }}</h5>
            <p class="card-text">{{ i.descripcionCorta }}</p>
            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#verMasInfo"
              (click)="verMasInfo(i)">
              Ver más
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>


<!-- Modal -->
<div class="modal fade" id="verMasInfo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">
          {{tarjetaSeleccionada?.nombre}}
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="modal-imagen">
          <img class="imagenTarjetas" src="{{tarjetaSeleccionada?.img}}" alt="{{tarjetaSeleccionada?.alt}}">
        </div>

        <div class="modal-description">
          {{tarjetaSeleccionada?.informacion}}
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
