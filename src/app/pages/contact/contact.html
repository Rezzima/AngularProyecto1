<div class="bloqueUno">
    <div>
        <h2 class="titulo">Enviar un mensaje</h2>
    </div>
    <div>
        <form [formGroup]="nuevoMensaje" (ngSubmit)="enviarMensaje()">
            <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <input type="text" id="mensaje" class="form-control" formControlName="mensaje">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" class="form-control" formControlName="email">
            </div>
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" id="nombre" class="form-control" formControlName="nombre">
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="!nuevoMensaje.valid">Enviar</button>
        </form>
    </div>
</div>
