<h1 class="titulo">Aves</h1>

<!-- ngFor -->
<div class="contenedorTarjetas">
  <div class="container text-center">
    <div class="row">
      <div *ngFor="let i of informacion" class="col-lg-4 col-md-6">
        <div class="p-3 card">
          <img src="{{ i.img }}" class="card-image-top" alt="{{ i.alt }}">
          <div class="card-body">
            <h5 class="card-title">{{ i.nombre }}</h5>
            <p class="card-text">{{ i.informacion }} - {{ i.edadProm }}</p>
            <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#verMasInfo"
              (click)="verMasInfo(i)">
              Ver más
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Seccion 1 -->
<div class="contenedorSeccionUno">
  <h1 class="tituloSecciones">Scolopacidae</h1>
  <div class="bloqueUno">
    <div class="imagenSecciones">
      <img class="imagenUno"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/fa/Least_Sandpiper_Don_Edwards_WR_1.jpg/250px-Least_Sandpiper_Don_Edwards_WR_1.jpg"
        alt="">
    </div>
    <div class="parrafo">
      <p>
        Los correlimos muestran una considerable variedad de tamaños y apariencia
        la amplia gama de formas corporales refleja una amplia gama de nichos ecológicos
      </p>
    </div>
  </div>
</div>


<!-- Modal -->
<div class="modal fade" id="verMasInfo" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">
          {{tarjetaSelect?.nombre}}
        </h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="modal-imagen">
          <img class="imagenTarjetas" src="{{tarjetaSelect?.img}}" alt="{{tarjetaSelect?.alt}}">
        </div>

        <div class="modal-description">
          {{tarjetaSelect?.informacion}}
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
